    <script>
      (function() {
        try {
          var nativeFetch = window.fetch ? window.fetch.bind(window) : null;
          if (!nativeFetch) return;

          function normalizeUrl(input) {
            if (typeof input === 'string') {
              // Strip duplicate /api/v1/api/v1/ from any URL
              if (input.indexOf('/api/v1/api/v1/') !== -1) {
                input = input.replace(/\/api\/v1\/api\/v1\//g, '/api/v1/');
              }

              // Full external URL
              if (input.indexOf('http://') === 0 || input.indexOf('https://') === 0) {
                return input;
              }
              // Already /api/v1
              if (input === '/api/v1' || input.indexOf('/api/v1/') === 0 || input.indexOf('/api/v1?') === 0) {
                return input;
              }
              // Rewrite /v1/... to /api/v1/...
              if (input.indexOf('/v1/') === 0) {
                return '/api' + input;
              }
              // Rewrite /api/... to /api/v1/... (e.g. /api/admin -> /api/v1/admin)
              if (input === '/api' || input === '/api/') {
                return '/api/v1';
              }
              if (input.indexOf('/api/') === 0) {
                return '/api/v1/' + input.slice(5);
              }
              // Specific API endpoints called without /api prefix (e.g. /admin -> /api/v1/admin)
              var apiPrefixes = [
                '/admin',
                '/orders',
                '/products',
                '/categories',
                '/users',
                '/upload',
                '/reviews',
                '/coupons',
                '/offers',
                '/banners',
                '/shipping-rules',
                '/health',
                '/db-status',
                '/seed'
              ];
              for (var i = 0; i < apiPrefixes.length; i++) {
                var prefix = apiPrefixes[i];
                if (input === prefix || input.indexOf(prefix + '/') === 0 || input.indexOf(prefix + '?') === 0) {
                  return '/api/v1' + input;
                }
              }
            }
            return input;
          }

          var currentFetch = function(input, init) {
            var transformed = normalizeUrl(input);
            init = init || {};
            try {
              var token = (typeof sessionStorage !== 'undefined' && sessionStorage.getItem('ms_admin_token')) ||
                          (typeof localStorage !== 'undefined' && localStorage.getItem('ms_admin_token'));
              if (token) {
                init.headers = init.headers || {};
                if (init.headers instanceof Headers) {
                  if (!init.headers.has('Authorization')) {
                    init.headers.set('Authorization', 'Bearer ' + token);
                    init.headers.set('x-admin-key', token);
                  }
                } else if (typeof init.headers === 'object') {
                  if (!init.headers['Authorization'] && !init.headers['authorization']) {
                    init.headers['Authorization'] = 'Bearer ' + token;
                    init.headers['x-admin-key'] = token;
                  }
                }
              }
            } catch (e) {}
            return nativeFetch(transformed, init);
          };

          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Fetch normalizer safeguard:', e);
        }
      })();
    </script>
